# 修改记录:
#   2026-10-04  Claude  新建: 三平台测试 + 构建 wheel + 安装冒烟测试; 推送 v* 标签时发布 Release
#
# 普通推送 / PR: 只跑 test + build, 不发布
# 推送标签 vX.Y.Z: 额外校验标签与 pyproject.toml 版本号一致, 通过后创建 GitHub Release 并上传安装包
name: build-release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # 测试里的子进程会输出中文; Windows 默认代码页不是 UTF-8, 不设会解码失败
  PYTHONUTF8: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 与生产环境(Debian 12)一致
          python-version: "3.11"
      - name: 安装依赖
        run: python -m pip install . pytest
      - name: 单元测试(不需要 spring 在场)
        run: python -m pytest -m "not integration" -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 校验标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 pyproject.toml 版本 ${ver} 不一致" >&2
            exit 1
          fi
      - name: 构建 sdist 与 wheel
        run: |
          python -m pip install build
          python -m build
          python -m zipfile -l dist/*.whl
      - name: 冒烟测试(在仓库外的独立 venv 里安装 wheel 并运行命令)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          test -x venv/bin/etl-quant-mcp
          venv/bin/python -c "import asyncio, server; print('tools:', len(asyncio.run(server.mcp.list_tools())))"
          # 未配置 spring 时必须立即启动失败(退出码 1)并说明缺什么, 而不是挂起等待连接
          set +e
          venv/bin/etl-quant-mcp < /dev/null 2> err.txt
          code=$?
          set -e
          cat err.txt
          test "$code" = 1
          grep -q "SPRING_DIR" err.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: 创建 Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
